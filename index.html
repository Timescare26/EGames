<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Mini Arcade</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  overflow:hidden;
  background: linear-gradient(270deg,#1b0033,#5a00a8,#0a001a);
  background-size:600% 600%;
  animation:bg 12s infinite;
}
@keyframes bg{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

.neon{
  font-size:60px;
  color:#ff4fd8;
  text-shadow:0 0 15px #ff00cc,0 0 40px #ff00cc;
}

button{
  padding:15px 25px;
  margin:10px;
  border:none;
  border-radius:15px;
  cursor:pointer;
}

.menu button{background:white;color:black;}
.selected{background:#ff00aa!important;color:white!important;}

input{
  padding:12px;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.5);
  color:white;
}

canvas{
  display:none;
  background:black;
  margin:20px auto;
  border-radius:15px;
}

#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}

#score{
  position:absolute;
  top:10px;
  left:10px;
}

</style>

</head>

<body>

<div id="menu">
  <h1>Mini Arcade</h1>
  <div class="neon">EGames</div>

<button onclick="selectGame('snake',this)">🐍 Snake</button> <button onclick="selectGame('runner',this)">🏃 Runner</button><br>

<input id="name" placeholder="Enter name"><br> <button onclick="startGame()">Start</button>

</div>

<div id="score"></div>

<div id="overlay">
  <h2 id="overText">Game Over</h2>
  <button onclick="startGame()">Restart</button>
  <button onclick="home()">Home</button>
</div>

<canvas id="c" width="600" height="400"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,name="";
let score=0,paused=false;
let highSnake=localStorage.getItem("snakeHigh")||0;
let highRunner=localStorage.getItem("runnerHigh")||0;

/* ---------- SOUND ---------- */
function beep(freq){
  let ctxAudio=new AudioContext();
  let osc=ctxAudio.createOscillator();
  osc.frequency.value=freq;
  osc.connect(ctxAudio.destination);
  osc.start();
  osc.stop(ctxAudio.currentTime+0.1);
}

/* ---------- MENU ---------- */
function selectGame(g,el){
  game=g;
  document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function startGame(){
  name=document.getElementById("name").value||"Player";
  if(!game){alert("Select a game");return;}

  document.getElementById("menu").style.display="none";
  document.getElementById("overlay").style.display="none";
  c.style.display="block";

  clearInterval(loop);

  if(game==="snake") snakeStart();
  if(game==="runner") runnerStart();
}

function home(){
  clearInterval(loop);
  c.style.display="none";
  document.getElementById("menu").style.display="block";
  document.getElementById("overlay").style.display="none";
}

/* ---------- SNAKE ---------- */
let snake,food,dx,dy,speed;

function snakeStart(){
  snake=[{x:200,y:200}];
  dx=20; dy=0;
  food=spawnFood();
  score=0;
  speed=100;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();

    if((k==="arrowup"||k==="w")&&dy===0){dx=0;dy=-20;}
    if((k==="arrowdown"||k==="s")&&dy===0){dx=0;dy=20;}
    if((k==="arrowleft"||k==="a")&&dx===0){dx=-20;dy=0;}
    if((k==="arrowright"||k==="d")&&dx===0){dx=20;dy=0;}

    if(k==="p") paused=!paused;
  };

  loop=setInterval(drawSnake,speed);
}

function spawnFood(){
  let f;
  do{
    f={x:Math.floor(Math.random()*30)*20,y:Math.floor(Math.random()*20)*20};
  }while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}

function drawSnake(){
  if(paused)return;

  ctx.clearRect(0,0,c.width,c.height);

  let head={x:snake[0].x+dx,y:snake[0].y+dy};

  if(head.x<0||head.y<0||head.x>=600||head.y>=400) return gameOver();

  for(let i=1;i<snake.length;i++){
    if(head.x===snake[i].x&&head.y===snake[i].y) return gameOver();
  }

  snake.unshift(head);

  if(head.x===food.x&&head.y===food.y){
    score++;
    beep(600);
    food=spawnFood();
    speed=Math.max(50, speed-2);
    clearInterval(loop);
    loop=setInterval(drawSnake,speed);
  } else snake.pop();

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,20,20);

  ctx.fillStyle="lime";
  snake.forEach(s=>ctx.fillRect(s.x,s.y,20,20));

  updateScore();
}

/* ---------- RUNNER ---------- */
let player,obs,grav,spd;

function runnerStart(){
  player={x:50,y:300,w:30,h:30,vy:0};
  obs=[];
  grav=1;
  spd=5;
  score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&player.y===300){
      player.vy=-15;
      beep(400);
    }
    if(e.key==="p") paused=!paused;
  };

  c.onclick=()=>{if(player.y===300)player.vy=-15;}

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  if(paused)return;

  ctx.clearRect(0,0,600,400);

  player.vy+=grav;
  player.y+=player.vy;
  if(player.y>300)player.y=300;

  if(Math.random()<0.02) obs.push({x:600,y:320,w:20,h:20});

  spd+=0.002;
  obs.forEach(o=>o.x-=spd);
  obs=obs.filter(o=>o.x>-20);

  for(let o of obs){
    if(player.x<o.x+o.w&&player.x+player.w>o.x&&
       player.y<o.y+o.h&&player.y+player.h>o.y){
      return gameOver();
    }
  }

  ctx.fillStyle="white";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle="red";
  obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

  score++;
  updateScore();
}

/* ---------- COMMON ---------- */
function updateScore(){
  if(game==="snake"){
    if(score>highSnake){
      highSnake=score;
      localStorage.setItem("snakeHigh",highSnake);
    }
    document.getElementById("score").innerHTML =
      `${name} | Snake: ${score} | High: ${highSnake}`;
  }else{
    if(score>highRunner){
      highRunner=score;
      localStorage.setItem("runnerHigh",highRunner);
    }
    document.getElementById("score").innerHTML =
      `${name} | Runner: ${score} | High: ${highRunner}`;
  }
}

function gameOver(){
  clearInterval(loop);
  beep(200);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
