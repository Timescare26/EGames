<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 620, H = 400;

let currentGame = null;
let loop = null;
let score = 0;
let lives = 3;
let level = 1;
let paused = false;
let playerName = 'PLAYER';
let particles = [];

const HIGH_SCORES_KEY = 'egames_hs';

/* ═══════════════════════════════════════
   HIGH SCORES
═══════════════════════════════════════ */
function loadHS(){
  try{ return JSON.parse(localStorage.getItem(HIGH_SCORES_KEY))||{}; }
  catch(e){ return {}; }
}
function saveHS(game,name,sc){
  let hs = loadHS();
  if(!hs[game]) hs[game]=[];
  hs[game].push({name,score:sc});
  hs[game].sort((a,b)=>b.score-a.score);
  hs[game]=hs[game].slice(0,5);
  localStorage.setItem(HIGH_SCORES_KEY,JSON.stringify(hs));
}
function getHS(game){ return (loadHS()[game]||[]).slice(0,3); }

function renderHS(){
  const panel = document.getElementById('hsList');
  const hs = loadHS();
  const games = ['snake','runner','pong'];
  let html = '';
  games.forEach(g=>{
    const entries = hs[g]||[];
    if(entries.length){
      html += `<div style="color:#665;font-size:6px;margin:6px 0 2px;text-transform:uppercase">${g}</div>`;
      entries.slice(0,3).forEach((e,i)=>{
        html += `<div class="hs-row"><span class="hs-name">${['①','②','③'][i]} ${e.name}</span><span class="hs-score">${e.score}</span></div>`;
      });
    }
  });
  panel.innerHTML = html || '<div style="color:#444;text-align:center;font-size:7px">NO RECORDS YET</div>';
}
renderHS();

/* ═══════════════════════════════════════
   MENU LOGIC (FIXED)
═══════════════════════════════════════ */
function selectGame(g, el){
  currentGame = g;

  document.querySelectorAll('.game-btn')
    .forEach(b => b.classList.remove('active'));

  el.classList.add('active');

  const hints = {
    snake:'WASD / ARROWS TO STEER',
    runner:'SPACE / UP TO JUMP  |  DOUBLE JUMP AVAILABLE',
    pong:'MOUSE TO MOVE PADDLE  |  HOLD CLICK'
  };

  document.getElementById('hintText').textContent = hints[g] || '';

  // 🔥 UI feedback fix
  document.getElementById('startBtn').textContent = `PLAY ${g.toUpperCase()} ▶`;
}

function startGame(){
  if(!currentGame){
    alert("SELECT A GAME FIRST");
    return;
  }

  playerName = (document.getElementById('playerName').value||'PLAYER')
    .toUpperCase()
    .slice(0,8);

  document.getElementById('menu').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  document.getElementById('overlay').classList.remove('visible');

  document.getElementById('hudName').textContent = playerName;

  restartGame();
}

function restartGame(){
  document.getElementById('overlay').classList.remove('visible');
  clearInterval(loop);
  loop = null;
  paused = false;

  score = 0;
  lives = 3;
  level = 1;
  particles = [];

  updateHUD();

  if(currentGame==='snake') initSnake();
  if(currentGame==='runner') initRunner();
  if(currentGame==='pong') initPong();
}

function goMenu(){
  clearInterval(loop);
  loop = null;
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('menu').style.display='flex';
  renderHS();
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') goMenu();
  if(e.key==='p'||e.key==='P'){
    if(!loop) return;
    paused = !paused;
    document.getElementById('pauseMsg').style.display = paused ? 'block' : 'none';
  }
});

/* HUD */
function updateHUD(){
  document.getElementById('hudScore').textContent=score;
  document.getElementById('hudLevel').textContent=level;

  const hs = getHS(currentGame);
  const best = hs.length ? Math.max(score,...hs.map(h=>h.score)) : score;
  document.getElementById('hudBest').textContent=best;

  document.getElementById('hudLives').textContent =
    lives > 0 ? '♥ '.repeat(lives).trim() : '✕';
}

/* PARTICLES */
function spawnParticles(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const s=2+Math.random()*4;
    particles.push({
      x,y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:1,
      color,
      size:2+Math.random()*3
    });
  }
}

function updateParticles(){
  particles = particles.filter(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.1;
    p.life-=0.04;

    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
    ctx.globalAlpha=1;

    return p.life>0;
  });
}

/* GAME OVER */
function gameOver(){
  clearInterval(loop);
  loop = null;

  saveHS(currentGame,playerName,score);

  document.getElementById('overScore').textContent = 'SCORE: '+score;
  document.getElementById('overlay').classList.add('visible');

  spawnParticles(W/2,H/2,'#ff00cc',20);
}

/* ===================== PLACEHOLDER: YOUR EXISTING GAMES UNCHANGED ===================== */
/* (Snake, Runner, Pong remain EXACTLY as you wrote them below this point) */

</script>
