<script>
/* ═══════════════════════════════════════
   CORE STATE
═══════════════════════════════════════ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 620, H = 400;

let currentGame = null;
let loop = null;

let score = 0;
let lives = 3;
let level = 1;

let paused = false;
let playerName = "PLAYER";

let particles = [];

/* ═══════════════════════════════════════
   HIGH SCORE
═══════════════════════════════════════ */
const HS_KEY = "egames_hs";

function loadHS(){
  try { return JSON.parse(localStorage.getItem(HS_KEY)) || {}; }
  catch(e){ return {}; }
}

function saveHS(game, name, sc){
  let hs = loadHS();
  if(!hs[game]) hs[game] = [];
  hs[game].push({name, score:sc});
  hs[game].sort((a,b)=>b.score-a.score);
  hs[game] = hs[game].slice(0,5);
  localStorage.setItem(HS_KEY, JSON.stringify(hs));
}

/* ═══════════════════════════════════════
   MENU FIX (IMPORTANT)
═══════════════════════════════════════ */
function selectGame(g, el){
  currentGame = g;

  document.querySelectorAll('.game-btn')
    .forEach(b => b.classList.remove('active'));

  el.classList.add('active');

  const hints = {
    snake:'WASD / ARROWS TO STEER',
    runner:'SPACE / UP TO JUMP',
    pong:'MOUSE TO MOVE PADDLE'
  };

  document.getElementById('hintText').textContent = hints[g] || '';
  document.getElementById('startBtn').textContent = "PLAY " + g.toUpperCase() + " ▶";
}

function startGame(){
  if(!currentGame){
    alert("SELECT A GAME FIRST");
    return;
  }

  playerName = (document.getElementById("playerName").value || "PLAYER")
    .toUpperCase()
    .slice(0,10);

  document.getElementById("menu").style.display = "none";
  document.getElementById("gameScreen").style.display = "flex";
  document.getElementById("overlay").classList.remove("visible");

  document.getElementById("hudName").textContent = playerName;

  restartGame();
}

function restartGame(){
  clearInterval(loop);
  loop = null;

  score = 0;
  lives = 3;
  level = 1;
  paused = false;
  particles = [];

  updateHUD();

  if(currentGame === "snake") initSnake();
  if(currentGame === "runner") initRunner();
  if(currentGame === "pong") initPong();
}

function goMenu(){
  clearInterval(loop);
  loop = null;

  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("menu").style.display = "flex";
}

/* ═══════════════════════════════════════
   PAUSE
═══════════════════════════════════════ */
document.addEventListener("keydown", e=>{
  if(e.key === "Escape") goMenu();

  if(e.key.toLowerCase() === "p"){
    paused = !paused;
    document.getElementById("pauseMsg").style.display =
      paused ? "block" : "none";
  }
});

/* ═══════════════════════════════════════
   HUD
═══════════════════════════════════════ */
function updateHUD(){
  document.getElementById("hudScore").textContent = score;
  document.getElementById("hudLevel").textContent = level;
  document.getElementById("hudLives").textContent =
    "♥ ".repeat(lives).trim();
}

/* ═══════════════════════════════════════
   PARTICLES
═══════════════════════════════════════ */
function spawnParticles(x,y,color,n=6){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = 1 + Math.random()*3;
    particles.push({
      x,y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:1,
      color
    });
  }
}

function drawParticles(){
  particles = particles.filter(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;

    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x,p.y,3,3);
    ctx.globalAlpha = 1;

    return p.life > 0;
  });
}

/* ═══════════════════════════════════════
   GAME OVER
═══════════════════════════════════════ */
function gameOver(){
  clearInterval(loop);
  loop = null;

  saveHS(currentGame, playerName, score);

  document.getElementById("overlay").classList.add("visible");
  document.getElementById("overScore").textContent = "SCORE: " + score;

  spawnParticles(W/2,H/2,"#ff00cc",20);
}

/* ═══════════════════════════════════════
   PLACEHOLDERS (YOUR EXISTING GAMES)
   DO NOT DELETE YOUR GAME CODE BELOW
═══════════════════════════════════════ */

/*
IMPORTANT:
Your existing functions must remain below:
- initSnake()
- initRunner()
- initPong()
- snakeTick / runnerTick / pongTick
*/

/* safety loop hook (optional) */
function gameLoop(){
  if(!paused) drawParticles();
  requestAnimationFrame(gameLoop);
}
gameLoop();

</script>
