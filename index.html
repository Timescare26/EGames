<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-GAMES RUNNER</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Press Start 2P', cursive;
  background:#000;
  color:#00ffee;
  overflow:hidden;
  text-align:center;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background: radial-gradient(circle at 50% 30%, #1a0033, #000);
  z-index:-1;
}

#menu{padding-top:60px;}
.title{font-size:24px;color:#ff00cc;text-shadow:0 0 10px #ff00cc;}

button{
  font-family:'Press Start 2P', cursive;
  padding:10px;
  margin:5px;
  border:2px solid #00ffee;
  background:#111;
  color:#00ffee;
  cursor:pointer;
}
button:active{transform:scale(0.95);}
.selected{background:#00ffee;color:#000}

input{
  padding:10px;
  background:#111;
  color:#00ffee;
  border:none;
}

#arcade{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
}

.machine{
  border:6px solid #333;
  padding:10px;
  background:#050505;
  box-shadow:0 0 30px #ff00cc;
}

canvas{
  width:90vw;
  max-width:600px;
  background:#000;
}

#score{
  position:absolute;
  top:10px;
  left:10px;
  font-size:10px;
}

#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}
</style>
</head>

<body>

<div id="menu">
  <div class="title">RUNNER MODE</div>

  <button onclick="select('runner',this)">RUNNER</button><br><br>

  <input id="name" placeholder="NAME"><br><br>
  <button onclick="start()">START</button>
</div>

<div id="score"></div>

<div id="overlay">
  <h3>GAME OVER</h3>
  <button onclick="start()">RESTART</button>
</div>

<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game,loop,name="",score=0;

/* MENU */
function select(g,el){
  game=g;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function start(){
  name=document.getElementById("name").value||"PLAYER";
  if(!game) return;

  document.getElementById("menu").style.display="none";
  document.getElementById("arcade").style.display="flex";
  document.getElementById("overlay").style.display="none";

  clearInterval(loop);
  runner();
}

/* ================= FOREST ================= */

let far=[],mid=[],near=[],groundX=0;

function initForest(){
  far=[],mid=[],near=[];
  for(let i=0;i<14;i++) far.push({x:i*60,y:170+Math.random()*20});
  for(let i=0;i<10;i++) mid.push({x:i*80,y:220+Math.random()*20});
  for(let i=0;i<8;i++) near.push({x:i*100,y:270+Math.random()*15});
}

function tree(x,y,s,c){
  // trunk
  ctx.fillStyle="#2b1b10";
  ctx.fillRect(x+s*0.4,y,s*0.2,s);

  // layered leaves
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.arc(x+s/2,y,s*0.55,0,Math.PI*2); ctx.fill();

  ctx.fillStyle=shade(c,20);
  ctx.beginPath();
  ctx.arc(x+s/3,y-10,s*0.45,0,Math.PI*2); ctx.fill();

  ctx.fillStyle=shade(c,-20);
  ctx.beginPath();
  ctx.arc(x+s*0.65,y-12,s*0.4,0,Math.PI*2); ctx.fill();
}

function shade(c,a){
  let n=parseInt(c.slice(1),16);
  let r=Math.min(255,Math.max(0,(n>>16)+a));
  let g=Math.min(255,Math.max(0(((n>>8)&255)+a)));
  let b=Math.min(255,Math.max(0((n&255)+a)));
  return `rgb(${r},${g},${b})`;
}

function drawForest(){
  let g=ctx.createLinearGradient(0,0,0,400);
  g.addColorStop(0,"#120020");
  g.addColorStop(1,"#000");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,600,400);

  far.forEach(t=>{
    t.x-=1;if(t.x<-60)t.x=620;
    tree(t.x,t.y,18,"#0a3d0a");
  });

  mid.forEach(t=>{
    t.x-=2;if(t.x<-60)t.x=620;
    tree(t.x,t.y,26,"#0f5a0f");
  });

  near.forEach(t=>{
    t.x-=4;if(t.x<-60)t.x=620;
    tree(t.x,t.y,34,"#16a016");
  });

  // ground
  ctx.fillStyle="#003300";
  ctx.fillRect(0,330,600,70);

  groundX-=6;
  if(groundX<-40)groundX=0;

  for(let i=0;i<600;i+=40){
    ctx.fillStyle="#00aa0030";
    ctx.fillRect(i+groundX,340,20,10);
  }
}

/* ================= RUNNER ================= */

let p,o,g,frame=0;

function runner(){
  initForest();

  p={x:80,y:300,vy:0};
  o=[];
  g=1;
  score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&p.y===300){
      p.vy=-15;
    }
  };

  loop=setInterval(draw,25);
}

function draw(){
  frame++;
  ctx.clearRect(0,0,600,400);

  drawForest();

  // physics
  p.vy+=g;
  p.y+=p.vy;
  if(p.y>300)p.y=300;

  // spawn obstacles
  if(Math.random()<0.03){
    o.push({x:600,y:320,w:20+Math.random()*20,h:20});
  }

  o.forEach(r=>r.x-=7);
  o=o.filter(r=>r.x>-60);

  // collision
  for(let r of o){
    if(p.x<r.x+r.w && p.x+30>r.x && p.y<r.y+r.h && p.y+30>r.y){
      return over();
    }
  }

  /* ================= RUNNER CHARACTER ================= */

  let bob=Math.sin(frame/5)*2;
  let leg=Math.sin(frame/4)*5;

  // HEAD
  ctx.fillStyle="#ffd6a5";
  ctx.fillRect(p.x+12,p.y-10+bob,12,12);

  // BODY (lean forward = running feel)
  ctx.fillStyle="#00e5d5";
  ctx.fillRect(p.x+10,p.y+2+bob,16,18);

  // ARMS (swing)
  ctx.fillStyle="#00bbaa";
  ctx.fillRect(p.x+4,p.y+6+bob+leg*0.3,6,10);
  ctx.fillRect(p.x+24,p.y+6+bob-leg*0.3,6,10);

  // LEGS (motion)
  ctx.fillStyle="#003c3c";
  ctx.fillRect(p.x+12,p.y+20+bob+leg,6,14);
  ctx.fillRect(p.x+18,p.y+20+bob-leg,6,14);

  /* rocks */
  o.forEach(r=>{
    ctx.fillStyle="#555";
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.fillStyle="#888";
    ctx.fillRect(r.x+2,r.y+2,r.w-4,r.h-4);
  });

  score++;
  update();
}

/* ================= UI ================= */

function update(){
  document.getElementById("score").innerText=
    `${name} | RUNNER : ${score}`;
}

function over(){
  clearInterval(loop);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
