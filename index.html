<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade X Pro+</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  overflow:hidden;
  background: radial-gradient(circle,#0b0015,#000);
}

/* ================= INTRO SCREEN (LEVEL UP STYLE) ================= */
#intro{
  position:fixed;
  inset:0;
  background:url("https://images.unsplash.com/photo-1527430253228-e93688616381?auto=format&fit=crop&w=1200&q=60");
  background-size:cover;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
  animation:fadeOut 2s ease 3s forwards;
}

#intro h1{
  font-size:70px;
  color:#ffcc00;
  text-shadow:0 0 20px #ff00cc,0 0 40px #00ffff;
  animation:zoom 1s ease;
}

#intro p{
  font-size:18px;
  color:#fff;
  opacity:0.8;
}

@keyframes zoom{
  from{transform:scale(0.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden}
}

/* CRT effect */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.04),
    rgba(255,255,255,0.04) 1px,
    transparent 2px,
    transparent 4px
  );
}

/* ================= MENU ================= */
#menu{
  padding-top:40px;
}

.neon{
  font-size:55px;
  color:#ff00cc;
  text-shadow:0 0 25px #ff00cc,0 0 40px #00ffff;
}

button{
  padding:14px 22px;
  margin:8px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:0.15s;
}
button:active{transform:scale(0.9)}
.selected{background:#ff00cc;color:white}

input{
  padding:10px;
  border-radius:10px;
  border:none;
  background:#111;
  color:white;
}

/* ================= ARCADE SCREEN ================= */
#arcade{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

.machine{
  padding:18px;
  border-radius:18px;
  border:8px solid #333;
  box-shadow:0 0 40px #ff00cc;
  background:#0a0a0a;
}

canvas{
  width:92vw;
  max-width:600px;
  height:auto;
  background:black;
  border-radius:10px;
}

/* ================= SCORE ================= */
#score{
  position:absolute;
  top:10px;
  left:10px;
  font-size:14px;
  color:#00ffff;
}

/* ================= OVERLAY ================= */
#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>ARCADE X</h1>
  <p>Press Start Button</p>
</div>

<!-- MENU -->
<div id="menu">
  <div class="neon">EGAMES</div>

  <button onclick="select('snake',this)">🐍 Snake</button>
  <button onclick="select('runner',this)">🏃 Runner</button>
  <button onclick="select('pong',this)">🏓 Pong</button><br>

  <input id="name" placeholder="Player Name"><br>
  <button onclick="start()">START</button>
</div>

<div id="score"></div>

<div id="overlay">
  <h2>GAME OVER</h2>
  <button onclick="start()">RESTART</button>
  <button onclick="home()">HOME</button>
</div>

<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,name="",score=0;

/* ================= MENU ================= */
function select(g,el){
  game=g;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function start(){
  name=document.getElementById("name").value||"PLAYER";
  if(!game)return alert("Select game");

  document.getElementById("menu").style.display="none";
  document.getElementById("arcade").style.display="flex";
  document.getElementById("overlay").style.display="none";

  clearInterval(loop);

  if(game==="snake") snake();
  if(game==="runner") runner();
  if(game==="pong") pong();
}

function home(){
  clearInterval(loop);
  document.getElementById("arcade").style.display="none";
  document.getElementById("menu").style.display="block";
}

/* ================= GRID ================= */
function grid(){
  ctx.strokeStyle="rgba(255,255,255,0.05)";
  for(let i=0;i<600;i+=20){
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,400);
    ctx.stroke();
  }
}

/* ================= SNAKE ================= */
let s,dx,dy,f;

function snake(){
  s=[{x:200,y:200}];
  dx=20;dy=0;
  f=food();
  score=0;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,95);
}

function food(){
  return {x:Math.floor(Math.random()*30)*20,y:Math.floor(Math.random()*20)*20};
}

function drawSnake(){
  ctx.clearRect(0,0,600,400);
  grid();

  let h={x:s[0].x+dx,y:s[0].y+dy};

  if(h.x<0||h.y<0||h.x>=600||h.y>=400) return over();

  s.unshift(h);

  if(h.x===f.x&&h.y===f.y){
    score++;
    f=food();
  }else s.pop();

  ctx.fillStyle="#00ffff";
  s.forEach(p=>ctx.fillRect(p.x,p.y,20,20));

  ctx.fillStyle="red";
  ctx.fillRect(f.x,f.y,20,20);

  update();
}

/* ================= RUNNER ================= */
let p,o,g;

function runner(){
  p={x:50,y:300,vy:0};
  o=[];g=1;score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&p.y===300)
      p.vy=-15;
  };

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,600,400);
  grid();

  p.vy+=g;
  p.y+=p.vy;
  if(p.y>300)p.y=300;

  if(Math.random()<0.02)o.push({x:600,y:320});

  o.forEach(x=>x.x-=6);
  o=o.filter(x=>x.x>-20);

  for(let x of o){
    if(x.x<70&&p.y===300) return over();
  }

  ctx.fillStyle="#00ffcc";
  ctx.fillRect(p.x,p.y,30,30);

  ctx.fillStyle="red";
  o.forEach(x=>ctx.fillRect(x.x,x.y,20,20));

  score++;
  update();
}

/* ================= PONG ================= */
let pad,ball,hold=false;

function pong(){
  pad={x:260,y:370,w:80,h:10};
  ball={x:300,y:200,dx:5,dy:-5};
  score=0;

  c.onmousedown=()=>hold=true;
  c.onmouseup=()=>hold=false;

  c.onmousemove=e=>{
    if(!hold)return;
    let r=c.getBoundingClientRect();
    pad.x=e.clientX-r.left-pad.w/2;
    pad.x=Math.max(0,Math.min(600-pad.w,pad.x));
  };

  loop=setInterval(drawPong,22); /* faster ball */
}

function drawPong(){
  ctx.clearRect(0,0,600,400);
  grid();

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>600)ball.dx*=-1;
  if(ball.y<0)ball.dy*=-1;

  if(ball.y>pad.y&&ball.x>pad.x&&ball.x<pad.x+pad.w){
    ball.dy*=-1;
    ball.dx*=1.12; /* faster bounce */
    score++;
  }

  if(ball.y>400) return over();

  ctx.fillStyle="white";
  ctx.fillRect(pad.x,pad.y,pad.w,pad.h);

  ctx.beginPath();
  ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
  ctx.fill();

  update();
}

/* ================= COMMON ================= */
function update(){
  document.getElementById("score").innerText =
    `${name} | ${game.toUpperCase()} : ${score}`;
}

function over(){
  clearInterval(loop);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
