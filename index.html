<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-GAMES RUNNER</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Press Start 2P', cursive;
  background:#000;
  color:#00ffee;
  overflow:hidden;
  text-align:center;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
}

#menu{
  padding-top:60px;
}

.title{
  font-size:22px;
  color:#ff00cc;
  text-shadow:0 0 10px #ff00cc;
}

button{
  font-family:'Press Start 2P';
  padding:10px;
  margin:5px;
  border:2px solid #00ffee;
  background:#111;
  color:#00ffee;
  cursor:pointer;
}

button:active{transform:scale(0.95)}

#game{
  display:none;
}

canvas{
  background:#000;
  width:90vw;
  max-width:700px;
  border:3px solid #222;
  margin-top:20px;
}

#score{
  position:absolute;
  top:10px;
  left:10px;
  font-size:10px;
}
</style>
</head>

<body>

<div id="menu">
  <div class="title">SIDE RUNNER</div>
  <button onclick="start()">START GAME</button>
</div>

<div id="score"></div>

<div id="game">
  <canvas id="c" width="700" height="400"></canvas>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let player,obstacles,frame,score,groundY=320,loop;

/* START */
function start(){
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";

  player={x:120,y:groundY,w:30,h:40,vy:0,jump:false};
  obstacles=[];
  frame=0;
  score=0;

  document.onkeydown=e=>{
    if(e.code==="Space" && !player.jump){
      player.vy=-12;
      player.jump=true;
    }
  };

  loop=setInterval(update,16);
}

/* BACKGROUND */
let trees=[];
for(let i=0;i<12;i++){
  trees.push({x:i*70,y:260+Math.random()*40,size:30+Math.random()*20});
}

/* DRAW TREE */
function drawTree(x,y,s){
  ctx.fillStyle="#2a1b10";
  ctx.fillRect(x+10,y,8,s);

  ctx.fillStyle="#0f5";
  ctx.beginPath();
  ctx.arc(x,y,15,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x+10,y-10,18,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x+20,y,15,0,Math.PI*2);
  ctx.fill();
}

/* UPDATE LOOP */
function update(){
  frame++;
  ctx.clearRect(0,0,700,400);

  /* SKY */
  let g=ctx.createLinearGradient(0,0,0,400);
  g.addColorStop(0,"#120020");
  g.addColorStop(1,"#000");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,700,400);

  /* PARALLAX TREES */
  trees.forEach(t=>{
    t.x-=2;
    if(t.x<-50)t.x=750;
    drawTree(t.x,t.y,t.size);
  });

  /* GROUND */
  ctx.fillStyle="#003300";
  ctx.fillRect(0,groundY,700,80);

  ctx.fillStyle="#005500";
  for(let i=0;i<700;i+=20){
    ctx.fillRect((i-frame*5)%700,groundY+10,10,5);
  }

  /* GRAVITY */
  player.vy+=0.6;
  player.y+=player.vy;

  if(player.y>=groundY-player.h){
    player.y=groundY-player.h;
    player.vy=0;
    player.jump=false;
  }

  /* OBSTACLES */
  if(Math.random()<0.02){
    obstacles.push({x:700,y:groundY-20,w:20,h:20});
  }

  obstacles.forEach(o=>o.x-=6);
  obstacles=obstacles.filter(o=>o.x>-50);

  /* COLLISION */
  for(let o of obstacles){
    if(player.x<o.x+o.w &&
       player.x+player.w>o.x &&
       player.y<o.y+o.h &&
       player.y+player.h>o.y){
      clearInterval(loop);
      alert("GAME OVER");
      location.reload();
    }
  }

  /* ===== PLAYER (SIDE RUNNER ANIMATION) ===== */
  let run = Math.sin(frame/6)*6;

  // legs
  ctx.fillStyle="#004c4c";
  ctx.fillRect(player.x+5,player.y+30+run,8,10);
  ctx.fillRect(player.x+17,player.y+30-run,8,10);

  // body
  ctx.fillStyle="#00e5d5";
  ctx.fillRect(player.x+8,player.y+10,16,20);

  // head
  ctx.fillStyle="#ffd6a5";
  ctx.fillRect(player.x+10,player.y-10,14,14);

  // arm swing
  ctx.fillStyle="#00bba8";
  ctx.fillRect(player.x+2,player.y+12+run*0.2,6,12);
  ctx.fillRect(player.x+24,player.y+12-run*0.2,6,12);

  /* obstacles */
  ctx.fillStyle="#666";
  obstacles.forEach(o=>{
    ctx.fillRect(o.x,o.y,o.w,o.h);
  });

  score++;
  document.getElementById("score").innerText="SCORE: "+score;
}
</script>

</body>
</html>
