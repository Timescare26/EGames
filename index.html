<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade X</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background: linear-gradient(270deg,#1b0033,#5a00a8,#0a001a);
  background-size:600% 600%;
  animation:bg 12s infinite;
}
@keyframes bg{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

/* MENU */
#menu{animation:fade 1s;}
@keyframes fade{from{opacity:0}to{opacity:1}}

.neon{
  font-size:60px;
  text-shadow:0 0 15px #ff00cc,0 0 40px #ff00cc;
}

button{
  padding:15px 25px;
  margin:10px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  transition:0.2s;
}
button:active{transform:scale(0.9)}

.selected{background:#ff00aa;color:white}

input{
  padding:10px;
  border:none;
  border-radius:10px;
}

/* ARCADE */
#arcade{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

.machine{
  background:#111;
  padding:20px;
  border-radius:20px;
  border:8px solid #444;
  box-shadow:0 0 40px #ff00cc;
}

canvas{
  width:90vw;
  max-width:600px;
  background:black;
  border-radius:10px;
}

/* UI */
#score{position:absolute;top:10px;left:10px}
#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}
</style>

</head>

<body>

<div id="menu">
  <h1>Mini Arcade</h1>
  <div class="neon">EGames</div>

<button onclick="selectGame('snake',this)">🐍 Snake</button> <button onclick="selectGame('runner',this)">🏃 Runner</button><br>

<input id="name" placeholder="Enter name"><br> <button onclick="startGame()">Start</button>

</div>

<div id="score"></div>

<div id="overlay">
  <h2>Game Over</h2>
  <button onclick="startGame()">Restart</button>
  <button onclick="home()">Home</button>
</div>

<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,name="";
let score=0,paused=false;
let highSnake=localStorage.getItem("snakeHigh")||0;
let highRunner=localStorage.getItem("runnerHigh")||0;

/* SOUND */
function beep(f){
  let a=new AudioContext();
  let o=a.createOscillator();
  o.frequency.value=f;
  o.connect(a.destination);
  o.start();
  o.stop(a.currentTime+0.1);
}

/* MENU */
function selectGame(g,el){
  game=g;
  document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function startGame(){
  name=document.getElementById("name").value||"Player";
  if(!game){alert("Select game");return;}

  document.getElementById("menu").style.display="none";
  document.getElementById("overlay").style.display="none";
  document.getElementById("arcade").style.display="flex";

  clearInterval(loop);
  paused=false;

  if(game==="snake") snakeStart();
  else runnerStart();
}

function home(){
  clearInterval(loop);
  document.getElementById("arcade").style.display="none";
  document.getElementById("menu").style.display="block";
  document.getElementById("overlay").style.display="none";
}

/* GRID */
function drawGrid(){
  ctx.strokeStyle="rgba(255,255,255,0.05)";
  for(let x=0;x<600;x+=20){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke();
  }
  for(let y=0;y<400;y+=20){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(600,y);ctx.stroke();
  }
}

/* SNAKE */
let snake,food,dx,dy,speed;

function snakeStart(){
  snake=[{x:200,y:200}];
  dx=20; dy=0;
  food=spawnFood();
  score=0;
  speed=100;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
    if(k==="p")paused=!paused;
  };

  loop=setInterval(drawSnake,speed);
}

function spawnFood(){
  let f;
  do{
    f={x:Math.floor(Math.random()*30)*20,y:Math.floor(Math.random()*20)*20};
  }while(snake.some(s=>s.x===f.x&&s.y===f.y));
  return f;
}

function drawSnake(){
  if(paused)return;

  ctx.clearRect(0,0,600,400);
  drawGrid();

  let head={x:snake[0].x+dx,y:snake[0].y+dy};

  if(head.x<0||head.y<0||head.x>=600||head.y>=400) return gameOver();

  for(let i=1;i<snake.length;i++){
    if(head.x===snake[i].x&&head.y===snake[i].y) return gameOver();
  }

  snake.unshift(head);

  if(head.x===food.x&&head.y===food.y){
    score++;
    beep(600);
    food=spawnFood();
    speed=Math.max(50,speed-2);
    clearInterval(loop);
    loop=setInterval(drawSnake,speed);
  } else snake.pop();

  ctx.shadowBlur=15;
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?"#00ffff":"#00ff88";
    ctx.shadowColor="#00ffff";
    ctx.fillRect(s.x,s.y,20,20);
  });

  ctx.shadowBlur=20;
  ctx.fillStyle="#ff004c";
  ctx.beginPath();
  ctx.arc(food.x+10,food.y+10,10,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;
  updateScore();
}

/* RUNNER */
let player,obs,grav,spd;

function runnerStart(){
  player={x:50,y:300,w:30,h:30,vy:0};
  obs=[];
  grav=1;
  spd=5;
  score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&player.y===300){
      player.vy=-15;
      beep(400);
    }
    if(e.key==="p")paused=!paused;
  };

  c.addEventListener("touchstart",()=>{
    if(player.y===300)player.vy=-15;
  });

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  if(paused)return;

  ctx.clearRect(0,0,600,400);
  drawGrid();

  player.vy+=grav;
  player.y+=player.vy;
  if(player.y>300)player.y=300;

  if(Math.random()<0.02) obs.push({x:600,y:320,w:20,h:20});

  spd+=0.002;
  obs.forEach(o=>o.x-=spd);
  obs=obs.filter(o=>o.x>-20);

  for(let o of obs){
    if(player.x<o.x+o.w&&player.x+player.w>o.x&&
       player.y<o.y+o.h&&player.y+player.h>o.y){
      return gameOver();
    }
  }

  ctx.shadowBlur=20;
  ctx.fillStyle="#00ccff";
  ctx.shadowColor="#00ccff";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle="#ff0033";
  ctx.shadowColor="#ff0033";
  obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

  ctx.shadowBlur=0;

  score++;
  updateScore();
}

/* COMMON */
function updateScore(){
  if(game==="snake"){
    if(score>highSnake){
      highSnake=score;
      localStorage.setItem("snakeHigh",highSnake);
    }
    scoreText(`${name} | Snake: ${score} | High: ${highSnake}`);
  }else{
    if(score>highRunner){
      highRunner=score;
      localStorage.setItem("runnerHigh",highRunner);
    }
    scoreText(`${name} | Runner: ${score} | High: ${highRunner}`);
  }
}

function scoreText(t){
  document.getElementById("score").innerHTML=t;
}

function gameOver(){
  clearInterval(loop);
  beep(200);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
