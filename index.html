<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-GAMES ARCADE X</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Press Start 2P', cursive;
  background:#000;
  color:#00ffee;
  text-align:center;
  overflow:hidden;
}

/* CRT */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,#1a0033,#000);
  z-index:-1;
}

/* MENU */
#menu{padding-top:60px;}
.title{font-size:28px;color:#ff00cc;text-shadow:0 0 10px #ff00cc;}
button{
  font-family:'Press Start 2P', cursive;
  padding:10px;
  margin:5px;
  border:2px solid #00ffee;
  background:#111;
  color:#00ffee;
  cursor:pointer;
}
button:active{transform:scale(0.95);}
.selected{background:#00ffee;color:#000}

input{
  padding:10px;
  background:#111;
  border:none;
  color:#00ffee;
}

/* ARCADE */
#arcade{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
}

.machine{
  border:6px solid #333;
  background:#050505;
  padding:10px;
  box-shadow:0 0 25px #ff00cc;
}

canvas{
  width:90vw;
  max-width:600px;
  background:#000;
}

#score{
  position:absolute;
  top:10px;
  left:10px;
  font-size:10px;
}

#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}
</style>
</head>

<body>

<div id="menu">
  <div class="title">E-GAMES ARCADE</div>

  <button onclick="select('snake',this)">SNAKE</button>
  <button onclick="select('runner',this)">RUNNER</button>
  <button onclick="select('pong',this)">PONG</button><br><br>

  <input id="name" placeholder="NAME"><br><br>
  <button onclick="start()">START</button>
</div>

<div id="score"></div>

<div id="overlay">
  <h3>GAME OVER</h3>
  <button onclick="start()">RESTART</button>
</div>

<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game,loop,name="",score=0;

/* MENU */
function select(g,el){
  game=g;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function start(){
  name=document.getElementById("name").value||"PLAYER";
  if(!game)return;

  document.getElementById("menu").style.display="none";
  document.getElementById("arcade").style.display="flex";
  document.getElementById("overlay").style.display="none";

  clearInterval(loop);

  if(game==="snake") snake();
  if(game==="runner") runner();
  if(game==="pong") pong();
}

/* ================= FOREST BACKGROUND ================= */
let trees=[];
let groundX=0;

function drawForest(){
  // moving ground
  ctx.fillStyle="#003300";
  ctx.fillRect(0,350,600,50);

  groundX-=4;
  if(groundX<-20)groundX=0;

  for(let i=0;i<600;i+=40){
    ctx.fillStyle="#00aa00";
    ctx.fillRect(i+groundX,340,20,10);
  }

  // trees (parallax)
  trees.forEach(t=>{
    t.x-=t.speed;

    ctx.fillStyle="#005500";
    ctx.fillRect(t.x,t.y,10,40);

    ctx.fillStyle="#007700";
    ctx.fillRect(t.x-10,t.y,30,20);
  });

  trees=trees.filter(t=>t.x>-50);

  if(Math.random()<0.03){
    trees.push({x:600,y:300+Math.random()*20,speed:2});
  }
}

/* ================= RUNNER (FIXED + FOREST) ================= */
let p,o,g;

function runner(){
  p={x:50,y:300,vy:0};
  o=[];
  g=1;
  score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&p.y===300){
      p.vy=-15;
    }
  };

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,600,400);

  drawForest();

  // player physics
  p.vy+=g;
  p.y+=p.vy;
  if(p.y>300)p.y=300;

  // spawn rocks
  if(Math.random()<0.03){
    o.push({
      x:600,
      y:320,
      w:20+Math.random()*20,
      h:20+Math.random()*20
    });
  }

  // move obstacles
  o.forEach(x=>x.x-=6);
  o=o.filter(x=>x.x>-40);

  // collision
  for(let x of o){
    if(
      p.x < x.x+x.w &&
      p.x+30 > x.x &&
      p.y < x.y+x.h &&
      p.y+30 > x.y
    ){
      return over();
    }
  }

  // draw player
  ctx.fillStyle="#00ffff";
  ctx.fillRect(p.x,p.y,30,30);

  // rocks
  ctx.fillStyle="#888";
  o.forEach(x=>ctx.fillRect(x.x,x.y,x.w,x.h));

  score++;
  update();
}

/* ================= SNAKE ================= */
let s,dx,dy,f;

function snake(){
  s=[{x:200,y:200}];
  dx=20;dy=0;
  f=food();
  score=0;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,110);
}

function drawSnake(){
  ctx.clearRect(0,0,600,400);

  let h={x:s[0].x+dx,y:s[0].y+dy};

  if(h.x<0||h.y<0||h.x>=600||h.y>=400)return over();

  s.unshift(h);
  if(h.x===f.x&&h.y===f.y){
    score++;
    f=food();
  }else s.pop();

  ctx.fillStyle="#00ff88";
  s.forEach(p=>ctx.fillRect(p.x,p.y,20,20));

  ctx.fillStyle="red";
  ctx.fillRect(f.x,f.y,20,20);

  update();
}

function food(){
  return {x:Math.floor(Math.random()*30)*20,y:Math.floor(Math.random()*20)*20};
}

/* ================= PONG ================= */
let pad,ball,hold=false;

function pong(){
  pad={x:260,y:370,w:80,h:10};
  ball={x:300,y:200,dx:5,dy:-5};
  score=0;

  c.onmousedown=()=>hold=true;
  c.onmouseup=()=>hold=false;

  c.onmousemove=e=>{
    if(!hold)return;
    let r=c.getBoundingClientRect();
    pad.x=e.clientX-r.left-pad.w/2;
  };

  loop=setInterval(drawPong,25);
}

function drawPong(){
  ctx.clearRect(0,0,600,400);

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>600)ball.dx*=-1;
  if(ball.y<0)ball.dy*=-1;

  if(ball.y>pad.y&&ball.x>pad.x&&ball.x<pad.x+pad.w){
    ball.dy*=-1;
    ball.dx*=1.1;
    score++;
  }

  if(ball.y>400)return over();

  ctx.fillStyle="#fff";
  ctx.fillRect(pad.x,pad.y,pad.w,pad.h);

  ctx.beginPath();
  ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
  ctx.fill();

  update();
}

/* ================= COMMON ================= */
function update(){
  document.getElementById("score").innerText=
    `${name} | ${game.toUpperCase()} : ${score}`;
}

function over(){
  clearInterval(loop);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
