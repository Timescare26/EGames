<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Arcade Hub</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:black;
  color:white;
}

/* ================= STAR BACKGROUND ================= */
.stars{
  position:fixed;
  inset:0;
  background:black;
}
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  opacity:0.6;
  animation:move 6s linear infinite;
}
@keyframes move{
  from{transform:translateY(0)}
  to{transform:translateY(100vh)}
}

/* ================= MAIN MENU (PIXEL STYLE) ================= */
#menu{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.pixel-box{
  padding:30px;
  border:4px solid #00ffff;
  box-shadow:0 0 20px #00ffff;
  background:rgba(0,0,0,0.8);
  text-align:center;
}

.title{
  font-size:40px;
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
  margin-bottom:10px;
}

.subtitle{
  color:#aaa;
  margin-bottom:20px;
}

/* ================= BUTTON ================= */
button{
  padding:12px 20px;
  margin:8px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:#111;
  color:white;
  border:2px solid #00ffff;
  transition:0.2s;
}
button:hover{
  background:#00ffff;
  color:black;
  transform:scale(1.05);
}
button:active{
  transform:scale(0.95);
}

/* ================= ARCADE SCREEN ================= */
#gameScreen{
  display:none;
  position:absolute;
  inset:0;
  justify-content:center;
  align-items:center;
}

.arcade-frame{
  border:6px solid #00ffff;
  box-shadow:0 0 30px #00ffff;
  background:black;
  padding:10px;
}

canvas{
  width:90vw;
  max-width:600px;
  height:auto;
  background:black;
}

/* ================= SCORE ================= */
#score{
  position:absolute;
  top:10px;
  left:10px;
  color:#00ffff;
  font-size:14px;
}

/* ================= OVERLAY ================= */
#overlay{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.8);
  z-index:20;
}
</style>
</head>

<body>

<!-- STAR BACKGROUND -->
<div class="stars" id="stars"></div>

<!-- MENU -->
<div id="menu">
  <div class="pixel-box">
    <div class="title">START NEW GAME</div>
    <div class="subtitle">RETRO ARCADE HUB</div>

    <button onclick="select('snake')">🐍 Snake</button>
    <button onclick="select('runner')">🏃 Runner</button>
    <button onclick="select('pong')">🏓 Pong</button><br>

    <button onclick="startGame()">▶ PLAY</button>
  </div>
</div>

<!-- SCORE -->
<div id="score"></div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <div class="arcade-frame">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<!-- GAME OVER -->
<div id="overlay">
  <h1>GAME OVER</h1>
  <button onclick="startGame()">RESTART</button>
  <button onclick="back()">HOME</button>
</div>

<script>
/* ================= STARS ================= */
const starContainer=document.getElementById("stars");
for(let i=0;i<80;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.animationDuration=(2+Math.random()*5)+"s";
  starContainer.appendChild(s);
}

/* ================= SETUP ================= */
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,score=0;

/* ================= SELECT GAME ================= */
function select(g){
  game=g;
  beep(300);
}

/* ================= START ================= */
function startGame(){
  if(!game)return alert("Select game!");

  document.getElementById("menu").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  document.getElementById("overlay").style.display="none";

  clearInterval(loop);

  if(game==="snake") snake();
  if(game==="runner") runner();
  if(game==="pong") pong();
}

function back(){
  clearInterval(loop);
  document.getElementById("menu").style.display="flex";
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("overlay").style.display="none";
}

/* ================= SOUND ================= */
function beep(f){
  let a=new AudioContext();
  let o=a.createOscillator();
  o.frequency.value=f;
  o.connect(a.destination);
  o.start();
  o.stop(a.currentTime+0.08);
}

/* ================= SNAKE ================= */
let s,dx,dy,f;

function snake(){
  s=[{x:200,y:200}];
  dx=20;dy=0;
  f=food();
  score=0;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,90);
}

function food(){
  return {x:Math.floor(Math.random()*30)*20,y:Math.floor(Math.random()*20)*20};
}

function drawSnake(){
  ctx.clearRect(0,0,600,400);

  let h={x:s[0].x+dx,y:s[0].y+dy};

  if(h.x<0||h.y<0||h.x>=600||h.y>=400) return over();

  s.unshift(h);

  if(h.x===f.x&&h.y===f.y){
    score++; beep(600);
    f=food();
  }else s.pop();

  ctx.fillStyle="#00ffff";
  s.forEach(p=>ctx.fillRect(p.x,p.y,20,20));

  ctx.fillStyle="red";
  ctx.fillRect(f.x,f.y,20,20);

  update();
}

/* ================= RUNNER ================= */
let p,o,g;

function runner(){
  p={x:50,y:300,vy:0};
  o=[];g=1;score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&p.y===300){
      p.vy=-15;
      beep(400);
    }
  };

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,600,400);

  p.vy+=g;
  p.y+=p.vy;
  if(p.y>300)p.y=300;

  if(Math.random()<0.02)o.push({x:600,y:320});

  o.forEach(x=>x.x-=6);
  o=o.filter(x=>x.x>-20);

  for(let x of o){
    if(x.x<70&&p.y===300) return over();
  }

  ctx.fillStyle="#00ffcc";
  ctx.fillRect(p.x,p.y,30,30);

  ctx.fillStyle="red";
  o.forEach(x=>ctx.fillRect(x.x,x.y,20,20));

  score++;
  update();
}

/* ================= PONG ================= */
let pad,ball,hold=false;

function pong(){
  pad={x:260,y:370,w:80,h:10};
  ball={x:300,y:200,dx:5,dy:-5};
  score=0;

  c.onmousedown=()=>hold=true;
  c.onmouseup=()=>hold=false;

  c.onmousemove=e=>{
    if(!hold)return;
    let r=c.getBoundingClientRect();
    pad.x=e.clientX-r.left-pad.w/2;
  };

  loop=setInterval(drawPong,22);
}

function drawPong(){
  ctx.clearRect(0,0,600,400);

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>600)ball.dx*=-1;
  if(ball.y<0)ball.dy*=-1;

  if(ball.y>pad.y&&ball.x>pad.x&&ball.x<pad.x+pad.w){
    ball.dy*=-1;
    ball.dx*=1.1;
    score++;
  }

  if(ball.y>400) return over();

  ctx.fillStyle="white";
  ctx.fillRect(pad.x,pad.y,pad.w,pad.h);

  ctx.beginPath();
  ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
  ctx.fill();

  update();
}

/* ================= COMMON ================= */
function update(){
  document.getElementById("score").innerText=
    `${game.toUpperCase()} | SCORE: ${score}`;
}

function over(){
  clearInterval(loop);
  document.getElementById("overlay").style.display="flex";
}
</script>

</body>
</html>
