<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade X Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  background: linear-gradient(270deg,#1b0033,#5a00a8,#0a001a);
  background-size:600% 600%;
  animation:bg 12s infinite;
}
@keyframes bg{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

.neon{
  font-size:60px;
  text-shadow:0 0 20px #ff00cc;
}

button{
  padding:15px 25px;
  margin:10px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  transition:0.2s;
}
button:active{transform:scale(0.9)}

.selected{background:#ff00aa;color:white}

input{
  padding:10px;
  border-radius:10px;
  border:none;
}

/* ARCADE */
#arcade{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

.machine{
  background:#111;
  padding:20px;
  border-radius:20px;
  border:8px solid #444;
  box-shadow:0 0 40px #ff00cc;
}

canvas{
  width:90vw;
  max-width:600px;
  background:black;
  border-radius:10px;
}

#score{position:absolute;top:10px;left:10px}
#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}
</style>

</head>

<body>

<div id="menu">
  <h1>Mini Arcade</h1>
  <div class="neon">EGames</div>

<button onclick="selectGame('snake',this)">🐍 Snake</button> <button onclick="selectGame('runner',this)">🏃 Runner</button> <button onclick="selectGame('pong',this)">🏓 Pong</button><br>

<input id="name" placeholder="Enter name"><br> <button onclick="startGame()">Start</button>

</div>

<div id="score"></div>

<div id="overlay">
  <h2>Game Over</h2>
  <button onclick="startGame()">Restart</button>
  <button onclick="home()">Home</button>
</div>

<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,name="";
let score=0,paused=false;

let highs={
  snake:localStorage.getItem("snakeHigh")||0,
  runner:localStorage.getItem("runnerHigh")||0,
  pong:localStorage.getItem("pongHigh")||0
};

/* SOUND */
function beep(f){
  let a=new AudioContext();
  let o=a.createOscillator();
  o.frequency.value=f;
  o.connect(a.destination);
  o.start();
  o.stop(a.currentTime+0.1);
}

/* MENU */
function selectGame(g,el){
  game=g;
  document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function startGame(){
  name=document.getElementById("name").value||"Player";
  if(!game){alert("Select game");return;}

  document.getElementById("menu").style.display="none";
  document.getElementById("overlay").style.display="none";
  document.getElementById("arcade").style.display="flex";

  clearInterval(loop);
  paused=false;

  if(game==="snake") snakeStart();
  if(game==="runner") runnerStart();
  if(game==="pong") pongStart();
}

function home(){
  clearInterval(loop);
  document.getElementById("arcade").style.display="none";
  document.getElementById("menu").style.display="block";
  document.getElementById("overlay").style.display="none";
}

/* GRID */
function grid(){
  ctx.strokeStyle="rgba(255,255,255,0.05)";
  for(let x=0;x<600;x+=20){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke();
  }
}

/* ---------- SNAKE ---------- */
let snake,food,dx,dy;

function snakeStart(){
  snake=[{x:200,y:200}];
  dx=20;dy=0;
  food=spawnFood();
  score=0;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,100);
}

function spawnFood(){
  return {
    x:Math.floor(Math.random()*30)*20,
    y:Math.floor(Math.random()*20)*20
  };
}

function drawSnake(){
  ctx.clearRect(0,0,600,400);
  grid();

  let head={x:snake[0].x+dx,y:snake[0].y+dy};

  if(head.x<0||head.y<0||head.x>=600||head.y>=400) return gameOver();

  snake.unshift(head);

  if(head.x===food.x&&head.y===food.y){
    score++;
    beep(600);
    food=spawnFood();
  } else snake.pop();

  ctx.fillStyle="#00ffcc";
  snake.forEach(s=>ctx.fillRect(s.x,s.y,20,20));

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,20,20);

  updateScore();
}

/* ---------- RUNNER ---------- */
let player,obs,grav;

function runnerStart(){
  player={x:50,y:300,w:30,h:30,vy:0};
  obs=[];
  grav=1;
  score=0;

  document.onkeydown=e=>{
    if(e.code==="Space"&&player.y===300)player.vy=-15;
  };

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,600,400);
  grid();

  player.vy+=grav;
  player.y+=player.vy;
  if(player.y>300)player.y=300;

  if(Math.random()<0.02) obs.push({x:600,y:320,w:20,h:20});
  obs.forEach(o=>o.x-=5);

  for(let o of obs){
    if(player.x<o.x+o.w && player.x+player.w>o.x &&
       player.y<o.y+o.h && player.y+player.h>o.y){
      return gameOver();
    }
  }

  ctx.fillStyle="white";
  ctx.fillRect(player.x,player.y,30,30);

  ctx.fillStyle="red";
  obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

  score++;
  updateScore();
}

/* ---------- PONG ---------- */
let paddle,ball;

function pongStart(){
  paddle={x:260,y:370,w:80,h:10};
  ball={x:300,y:200,dx:4,dy:-4};
  score=0;

  document.onkeydown=e=>{
    if(e.key==="ArrowLeft")paddle.x-=20;
    if(e.key==="ArrowRight")paddle.x+=20;
  };

  c.addEventListener("mousemove",(e)=>{
    let rect=c.getBoundingClientRect();
    paddle.x=e.clientX-rect.left-40;
  });

  loop=setInterval(drawPong,30);
}

function drawPong(){
  ctx.clearRect(0,0,600,400);
  grid();

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>600)ball.dx*=-1;
  if(ball.y<0)ball.dy*=-1;

  if(ball.y>400) return gameOver();

  if(ball.y>paddle.y &&
     ball.x>paddle.x &&
     ball.x<paddle.x+paddle.w){
    ball.dy*=-1;
    score++;
    beep(700);
  }

  ctx.fillStyle="white";
  ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);

  ctx.beginPath();
  ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
  ctx.fill();

  updateScore();
}

/* ---------- COMMON ---------- */
function updateScore(){
  if(score>highs[game]){
    highs[game]=score;
    localStorage.setItem(game+"High",score);
  }
  document.getElementById("score").innerHTML=
    `${name} | ${game}: ${score} | High: ${highs[game]}`;
}

function gameOver(){
  clearInterval(loop);
  beep(200);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
