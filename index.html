<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade X Final</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  overflow:hidden;
  background: linear-gradient(270deg,#1b0033,#5a00a8,#0a001a);
  background-size:600% 600%;
  animation:bg 12s infinite;
}

@keyframes bg{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

/* MENU */
.neon{
  font-size:60px;
  text-shadow:0 0 20px #ff00cc;
}

button{
  padding:14px 22px;
  margin:8px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}
button:active{transform:scale(0.92)}

.selected{background:#ff00aa;color:white}

input{
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

/* ARCADE */
#arcade{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

.machine{
  background:#111;
  padding:18px;
  border-radius:18px;
  border:8px solid #444;
  box-shadow:0 0 35px #ff00cc;
}

canvas{
  width:90vw;
  max-width:600px;
  background:black;
  border-radius:10px;
}

#score{
  position:absolute;
  top:10px;
  left:10px;
  font-size:14px;
}

#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}
</style>

</head>

<body>

<div id="menu">
  <h1>Mini Arcade</h1>
  <div class="neon">EGames</div>

<button onclick="selectGame('snake',this)">🐍 Snake</button> <button onclick="selectGame('runner',this)">🏃 Runner</button> <button onclick="selectGame('pong',this)">🏓 Pong</button><br>

<input id="name" placeholder="Enter name"><br> <button onclick="startGame()">Start</button>

</div>

<div id="score"></div>

<div id="overlay">
  <h2>Game Over</h2>
  <button onclick="startGame()">Restart</button>
  <button onclick="home()">Home</button>
</div>

<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,name="";
let score=0;

/* HIGH SCORES */
let high={
  snake:localStorage.getItem("snake")||0,
  runner:localStorage.getItem("runner")||0,
  pong:localStorage.getItem("pong")||0
};

/* SOUND */
function beep(f){
  let a=new AudioContext();
  let o=a.createOscillator();
  o.frequency.value=f;
  o.connect(a.destination);
  o.start();
  o.stop(a.currentTime+0.08);
}

/* MENU */
function selectGame(g,el){
  game=g;
  document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function startGame(){
  name=document.getElementById("name").value||"Player";
  if(!game){alert("Select game");return;}

  document.getElementById("menu").style.display="none";
  document.getElementById("overlay").style.display="none";
  document.getElementById("arcade").style.display="flex";

  clearInterval(loop);

  if(game==="snake") snakeStart();
  if(game==="runner") runnerStart();
  if(game==="pong") pongStart();
}

function home(){
  clearInterval(loop);
  document.getElementById("arcade").style.display="none";
  document.getElementById("menu").style.display="block";
  document.getElementById("overlay").style.display="none";
}

/* GRID */
function grid(){
  ctx.strokeStyle="rgba(255,255,255,0.05)";
  for(let i=0;i<600;i+=20){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);ctx.stroke();
  }
}

/* ---------------- SNAKE ---------------- */
let snake,food,dx,dy;

function snakeStart(){
  snake=[{x:200,y:200}];
  dx=20;dy=0;
  food=randFood();
  score=0;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,100);
}

function randFood(){
  return {
    x:Math.floor(Math.random()*30)*20,
    y:Math.floor(Math.random()*20)*20
  };
}

function drawSnake(){
  ctx.clearRect(0,0,600,400);
  grid();

  let h={x:snake[0].x+dx,y:snake[0].y+dy};

  if(h.x<0||h.y<0||h.x>=600||h.y>=400) return gameOver();

  for(let i=1;i<snake.length;i++){
    if(h.x===snake[i].x&&h.y===snake[i].y) return gameOver();
  }

  snake.unshift(h);

  if(h.x===food.x&&h.y===food.y){
    score++; beep(600);
    food=randFood();
  }else snake.pop();

  ctx.fillStyle="#00ffcc";
  snake.forEach(s=>ctx.fillRect(s.x,s.y,20,20));

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,20,20);

  updateScore();
}

/* ---------------- RUNNER ---------------- */
let player,obs,grav,spd;

function runnerStart(){
  player={x:50,y:300,w:30,h:30,vy:0};
  obs=[];
  grav=1;
  spd=5;
  score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&player.y===300){
      player.vy=-15;
      beep(400);
    }
  };

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,600,400);
  grid();

  player.vy+=grav;
  player.y+=player.vy;
  if(player.y>300)player.y=300;

  if(Math.random()<0.02) obs.push({x:600,y:320,w:20,h:20});

  spd+=0.002;
  obs.forEach(o=>o.x-=spd);
  obs=obs.filter(o=>o.x>-20);

  for(let o of obs){
    if(player.x<o.x+o.w&&player.x+player.w>o.x&&
       player.y<o.y+o.h&&player.y+player.h>o.y){
      return gameOver();
    }
  }

  ctx.fillStyle="#00ccff";
  ctx.fillRect(player.x,player.y,30,30);

  ctx.fillStyle="red";
  obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

  score++;
  updateScore();
}

/* ---------------- PONG ---------------- */
let paddle,ball;

function pongStart(){
  paddle={x:260,y:370,w:80,h:10};

  /* 🔥 FASTER START BALL */
  ball={x:300,y:200,dx:5,dy:-5};

  score=0;

  document.onkeydown=e=>{
    if(e.key==="ArrowLeft")paddle.x-=25;
    if(e.key==="ArrowRight")paddle.x+=25;
  };

  loop=setInterval(drawPong,30);
}

function drawPong(){
  ctx.clearRect(0,0,600,400);
  grid();

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>600) ball.dx*=-1;
  if(ball.y<0) ball.dy*=-1;

  /* paddle bounce */
  if(ball.y>paddle.y &&
     ball.x>paddle.x &&
     ball.x<paddle.x+paddle.w){

    ball.dy*=-1;

    /* 🔥 SPEED INCREASE ON HIT */
    ball.dx *= 1.08;
    ball.dy *= 1.08;

    score++;
    beep(700);
  }

  if(ball.y>400) return gameOver();

  ctx.fillStyle="white";
  ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);

  ctx.beginPath();
  ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
  ctx.fill();

  updateScore();
}

/* ---------------- COMMON ---------------- */
function updateScore(){
  if(score>high[game]){
    high[game]=score;
    localStorage.setItem(game,score);
  }
  document.getElementById("score").innerHTML=
    `${name} | ${game.toUpperCase()} : ${score} | High: ${high[game]}`;
}

function gameOver(){
  clearInterval(loop);
  beep(200);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
