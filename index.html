<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-GAMES Arcade</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
  overflow:hidden;
}

/* ===== HOME SCREEN ===== */
#menu{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#120018,#000);
}

.logo{
  font-family:'Press Start 2P', monospace;
  font-size:34px;
  color:#ff00cc;
  text-shadow:0 0 10px #ff00cc,0 0 25px #00ffff;
  margin-bottom:20px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

.subtitle{
  font-family:'Press Start 2P';
  font-size:10px;
  color:#00ffff;
  margin-bottom:20px;
}

input{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#111;
  color:white;
  margin-bottom:10px;
  text-align:center;
}

button{
  padding:12px 18px;
  margin:6px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#fff;
  font-weight:bold;
  transition:0.2s;
}
button:active{transform:scale(0.9)}
.selected{background:#ff00cc;color:white}

/* ===== ARCADE SCREEN ===== */
#arcade{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#050010,#000);
}

/* CRT effect */
#arcade::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.04),
    rgba(255,255,255,0.04) 1px,
    transparent 2px,
    transparent 4px
  );
}

/* arcade frame */
.machine{
  border:6px solid #222;
  padding:12px;
  border-radius:16px;
  box-shadow:0 0 30px #ff00cc;
  background:#000;
}

canvas{
  width:90vw;
  max-width:600px;
  height:auto;
  background:#000;
}

/* HUD */
#score{
  position:absolute;
  top:10px;
  left:10px;
  font-size:12px;
  color:#00ffff;
}

/* overlay */
#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
  text-align:center;
}

/* mobile controls */
#controls{
  display:none;
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
}
#controls button{
  width:60px;
  height:60px;
}
</style>
</head>

<body>

<!-- ===== MENU ===== -->
<div id="menu">
  <div class="logo">E-GAMES</div>
  <div class="subtitle">START NEW GAME</div>

  <input id="name" placeholder="PLAYER NAME">

  <div>
    <button onclick="select('snake',this)">🐍 Snake</button>
    <button onclick="select('runner',this)">🏃 Runner</button>
    <button onclick="select('pong',this)">🏓 Pong</button>
  </div>

  <button onclick="start()">PLAY</button>
</div>

<!-- ===== ARCADE ===== -->
<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>

  <div id="score"></div>

  <div id="overlay">
    <h2>GAME OVER</h2>
    <button onclick="start()">RESTART</button>
    <button onclick="home()">HOME</button>
  </div>

  <div id="controls">
    <button onclick="dir('up')">↑</button><br>
    <button onclick="dir('left')">←</button>
    <button onclick="dir('down')">↓</button>
    <button onclick="dir('right')">→</button>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game,loop,name="";
let score=0;

/* ===== SELECT GAME ===== */
function select(g,el){
  game=g;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

/* ===== START ===== */
function start(){
  name=document.getElementById("name").value||"PLAYER";
  if(!game)return alert("Select game");

  document.getElementById("menu").style.display="none";
  document.getElementById("arcade").style.display="flex";
  document.getElementById("overlay").style.display="none";

  clearInterval(loop);

  if(game==="snake") snake();
  if(game==="runner") runner();
  if(game==="pong") pong();
}

function home(){
  clearInterval(loop);
  document.getElementById("arcade").style.display="none";
  document.getElementById("menu").style.display="flex";
}

/* ===== GRID ===== */
function grid(){
  ctx.strokeStyle="rgba(0,255,255,0.05)";
  for(let i=0;i<600;i+=20){
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,400);
    ctx.stroke();
  }
}

/* ===== SNAKE ===== */
let s,dx,dy,f;

function snake(){
  s=[{x:200,y:200}];
  dx=20;dy=0;
  f=food();
  score=0;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,100);
}

function food(){
  return {
    x:Math.floor(Math.random()*30)*20,
    y:Math.floor(Math.random()*20)*20
  };
}

function drawSnake(){
  ctx.clearRect(0,0,600,400);
  grid();

  let h={x:s[0].x+dx,y:s[0].y+dy};

  if(h.x<0||h.y<0||h.x>=600||h.y>=400) return over();

  s.unshift(h);

  if(h.x===f.x&&h.y===f.y){
    score++;
    f=food();
  }else s.pop();

  ctx.fillStyle="#00ffff";
  s.forEach(p=>ctx.fillRect(p.x,p.y,20,20));

  ctx.fillStyle="red";
  ctx.fillRect(f.x,f.y,20,20);

  update();
}

/* ===== RUNNER ===== */
let p,o,g;

function runner(){
  p={x:50,y:300,vy:0};
  o=[];g=1;score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&p.y===300)
      p.vy=-15;
  };

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,600,400);
  grid();

  p.vy+=g;
  p.y+=p.vy;
  if(p.y>300)p.y=300;

  if(Math.random()<0.02)o.push({x:600,y:320});

  o.forEach(x=>x.x-=6);
  o=o.filter(x=>x.x>-20);

  for(let x of o){
    if(x.x<70&&p.y===300) return over();
  }

  ctx.fillStyle="#00ffcc";
  ctx.fillRect(p.x,p.y,30,30);

  ctx.fillStyle="red";
  o.forEach(x=>ctx.fillRect(x.x,x.y,20,20));

  score++;
  update();
}

/* ===== PONG ===== */
let pad,ball,hold=false;

function pong(){
  pad={x:260,y:370,w:80,h:10};
  ball={x:300,y:200,dx:5,dy:-5};
  score=0;

  c.onmousedown=()=>hold=true;
  c.onmouseup=()=>hold=false;

  c.onmousemove=e=>{
    if(!hold)return;
    let r=c.getBoundingClientRect();
    pad.x=e.clientX-r.left-pad.w/2;
  };

  loop=setInterval(drawPong,25);
}

function drawPong(){
  ctx.clearRect(0,0,600,400);
  grid();

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>600)ball.dx*=-1;
  if(ball.y<0)ball.dy*=-1;

  if(ball.y>pad.y&&ball.x>pad.x&&ball.x<pad.x+pad.w){
    ball.dy*=-1;
    ball.dx*=1.1;
    score++;
  }

  if(ball.y>400) return over();

  ctx.fillStyle="white";
  ctx.fillRect(pad.x,pad.y,pad.w,pad.h);

  ctx.beginPath();
  ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
  ctx.fill();

  update();
}

/* ===== COMMON ===== */
function update(){
  document.getElementById("score").innerText=
  `${name} | ${game.toUpperCase()} : ${score}`;
}

function over(){
  clearInterval(loop);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
