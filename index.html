<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade X Level Up</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:black;
  color:white;
}

/* ================= SPACE BACKGROUND ================= */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, #1a0033, transparent 40%),
    radial-gradient(circle at 80% 70%, #002b5c, transparent 40%),
    black;
  z-index:-2;
}

/* grid overlay like arcade HUD */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:-1;
}

/* ================= LEVEL UP SCREEN ================= */
#menu{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* glowing arcade panel */
.panel{
  width:320px;
  padding:25px;
  text-align:center;
  background:rgba(0,0,0,0.75);
  border:3px solid #00ffff;
  box-shadow:0 0 25px #00ffff, inset 0 0 20px #ff00cc;
  border-radius:14px;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

.title{
  font-size:32px;
  color:#ffcc00;
  text-shadow:0 0 10px #ff00cc,0 0 25px #00ffff;
  margin-bottom:10px;
}

.subtitle{
  font-size:12px;
  color:#aaa;
  margin-bottom:15px;
  letter-spacing:2px;
}

/* buttons */
button{
  padding:10px 16px;
  margin:6px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:#111;
  color:white;
  border:2px solid #00ffff;
  transition:0.15s;
}
button:hover{
  background:#00ffff;
  color:black;
  transform:scale(1.05);
}
button:active{transform:scale(0.9)}

/* start button glow like image */
.startBtn{
  background:#ff00cc;
  border:none;
  box-shadow:0 0 20px #ff00cc;
}

/* ================= GAME SCREEN ================= */
#gameScreen{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

.frame{
  border:4px solid #00ffff;
  box-shadow:0 0 30px #00ffff;
  background:black;
  padding:10px;
  border-radius:10px;
}

canvas{
  width:92vw;
  max-width:600px;
  background:black;
}

/* ================= SCORE ================= */
#score{
  position:absolute;
  top:10px;
  left:10px;
  color:#00ffff;
}

/* ================= OVERLAY ================= */
#overlay{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.8);
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->
<div id="menu">
  <div class="panel">
    <div class="title">LEVEL UP</div>
    <div class="subtitle">PRESS START BUTTON</div>

    <button onclick="pick('snake')">🐍 SNAKE</button>
    <button onclick="pick('runner')">🏃 RUNNER</button>
    <button onclick="pick('pong')">🏓 PONG</button>

    <br>
    <button class="startBtn" onclick="startGame()">▶ PLAY</button>
  </div>
</div>

<div id="score"></div>

<div id="overlay">
  <h1>GAME OVER</h1>
  <button onclick="startGame()">RESTART</button>
  <button onclick="home()">HOME</button>
</div>

<!-- ================= GAME ================= -->
<div id="gameScreen">
  <div class="frame">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,score=0;

/* ================= PICK ================= */
function pick(g){
  game=g;
}

/* ================= START ================= */
function startGame(){
  if(!game)return alert("Pick a game!");

  document.getElementById("menu").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  document.getElementById("overlay").style.display="none";

  clearInterval(loop);

  if(game==="snake") snake();
  if(game==="runner") runner();
  if(game==="pong") pong();
}

function home(){
  clearInterval(loop);
  document.getElementById("menu").style.display="flex";
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("overlay").style.display="none";
}

/* ================= SNAKE ================= */
let s,dx,dy,f;

function snake(){
  s=[{x:200,y:200}];
  dx=20;dy=0;
  f={x:300,y:200};
  score=0;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,90);
}

function drawSnake(){
  ctx.clearRect(0,0,600,400);

  let h={x:s[0].x+dx,y:s[0].y+dy};

  if(h.x<0||h.y<0||h.x>=600||h.y>=400) return over();

  s.unshift(h);

  if(h.x===f.x&&h.y===f.y){
    score++;
    f={x:Math.floor(Math.random()*30)*20,y:Math.floor(Math.random()*20)*20};
  }else s.pop();

  ctx.fillStyle="#00ffff";
  s.forEach(p=>ctx.fillRect(p.x,p.y,20,20));

  ctx.fillStyle="red";
  ctx.fillRect(f.x,f.y,20,20);

  update();
}

/* ================= RUNNER ================= */
let p,o,g;

function runner(){
  p={x:50,y:300,vy:0};
  o=[];g=1;score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&p.y===300)p.vy=-15;
  };

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,600,400);

  p.vy+=g;
  p.y+=p.vy;
  if(p.y>300)p.y=300;

  if(Math.random()<0.02)o.push({x:600,y:320});

  o.forEach(x=>x.x-=6);
  o=o.filter(x=>x.x>-20);

  for(let x of o){
    if(x.x<70&&p.y===300) return over();
  }

  ctx.fillStyle="#00ffcc";
  ctx.fillRect(p.x,p.y,30,30);

  ctx.fillStyle="red";
  o.forEach(x=>ctx.fillRect(x.x,x.y,20,20));

  score++;
  update();
}

/* ================= PONG ================= */
let pad,ball,hold=false;

function pong(){
  pad={x:260,y:370,w:80,h:10};
  ball={x:300,y:200,dx:5,dy:-5};
  score=0;

  c.onmousedown=()=>hold=true;
  c.onmouseup=()=>hold=false;

  c.onmousemove=e=>{
    if(!hold)return;
    let r=c.getBoundingClientRect();
    pad.x=e.clientX-r.left-pad.w/2;
  };

  loop=setInterval(drawPong,22);
}

function drawPong(){
  ctx.clearRect(0,0,600,400);

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>600)ball.dx*=-1;
  if(ball.y<0)ball.dy*=-1;

  if(ball.y>pad.y&&ball.x>pad.x&&ball.x<pad.x+pad.w){
    ball.dy*=-1;
    ball.dx*=1.1;
    score++;
  }

  if(ball.y>400) return over();

  ctx.fillStyle="white";
  ctx.fillRect(pad.x,pad.y,pad.w,pad.h);

  ctx.beginPath();
  ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
  ctx.fill();

  update();
}

/* ================= COMMON ================= */
function update(){
  document.getElementById("score").innerText=
    `${game.toUpperCase()} SCORE: ${score}`;
}

function over(){
  clearInterval(loop);
  document.getElementById("overlay").style.display="flex";
}
</script>

</body>
</html>
