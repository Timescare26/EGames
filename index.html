<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-GAMES ARCADE</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Press Start 2P', cursive;
  background:#000;
  color:#00ffee;
  text-align:center;
  overflow:hidden;
}

/* CRT + scanlines */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
}

/* glow bg */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,#220033,#000);
  z-index:-1;
}

/* MENU */
#menu{
  padding-top:60px;
}

.title{
  font-size:28px;
  color:#ff00cc;
  text-shadow:0 0 10px #ff00cc;
}

.subtitle{
  font-size:14px;
  color:#00ffff;
  margin-bottom:30px;
}

button{
  font-family:'Press Start 2P', cursive;
  padding:12px;
  margin:6px;
  border:none;
  background:#111;
  color:#00ffee;
  border:2px solid #00ffee;
  cursor:pointer;
}

button:active{
  transform:scale(0.95);
}

.selected{
  background:#00ffee;
  color:#000;
}

/* arcade screen */
#arcade{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
}

.machine{
  border:6px solid #333;
  padding:10px;
  background:#050505;
  box-shadow:0 0 25px #ff00cc;
}

canvas{
  background:#000;
  width:90vw;
  max-width:600px;
  height:400px;
}

/* score */
#score{
  position:absolute;
  top:10px;
  left:10px;
  font-size:10px;
  color:#00ffee;
}

/* overlay */
#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}
</style>
</head>

<body>

<div id="menu">
  <div class="title">E-GAMES</div>
  <div class="subtitle">RETRO ARCADE SYSTEM</div>

  <button onclick="select('snake',this)">SNAKE</button>
  <button onclick="select('runner',this)">RUNNER</button>
  <button onclick="select('pong',this)">PONG</button><br><br>

  <input id="name" placeholder="PLAYER NAME"><br><br>

  <button onclick="start()">START GAME</button>
</div>

<div id="score"></div>

<div id="overlay">
  <h3>GAME OVER</h3>
  <button onclick="start()">RESTART</button>
  <button onclick="home()">HOME</button>
</div>

<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,name="";
let score=0;

/* ---------- MENU ---------- */
function select(g,el){
  game=g;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function start(){
  name=document.getElementById("name").value||"PLAYER";
  if(!game)return alert("SELECT GAME");

  document.getElementById("menu").style.display="none";
  document.getElementById("arcade").style.display="flex";
  document.getElementById("overlay").style.display="none";

  clearInterval(loop);

  if(game==="snake") snake();
  if(game==="runner") runner();
  if(game==="pong") pong();
}

function home(){
  clearInterval(loop);
  document.getElementById("menu").style.display="block";
  document.getElementById("arcade").style.display="none";
}

/* ---------- SNAKE PIXEL ---------- */
let s,dx,dy,f;

function snake(){
  s=[{x:200,y:200}];
  dx=20;dy=0;
  f=food();
  score=0;

  document.onkeydown=e=>{
    let k=e.key.toLowerCase();
    if((k==="w"||k==="arrowup")&&dy===0){dx=0;dy=-20;}
    if((k==="s"||k==="arrowdown")&&dy===0){dx=0;dy=20;}
    if((k==="a"||k==="arrowleft")&&dx===0){dx=-20;dy=0;}
    if((k==="d"||k==="arrowright")&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,110);
}

function food(){
  return {x:Math.floor(Math.random()*30)*20,y:Math.floor(Math.random()*20)*20};
}

/* pixel snake */
function drawSnakePart(x,y,head=false){
  ctx.fillStyle="#003b2f";
  ctx.fillRect(x,y,20,20);

  ctx.fillStyle=head?"#00ff88":"#00cc66";
  ctx.fillRect(x+3,y+3,14,14);

  if(head){
    ctx.fillStyle="#000";
    ctx.fillRect(x+6,y+6,3,3);
    ctx.fillRect(x+12,y+6,3,3);
  }
}

/* pixel apple */
function apple(x,y){
  ctx.fillStyle="#8b0000";
  ctx.fillRect(x,y,20,20);

  ctx.fillStyle="#ff3333";
  ctx.fillRect(x+3,y+3,14,14);

  ctx.fillStyle="#00ff66";
  ctx.fillRect(x+10,y-3,4,4);
}

function drawSnake(){
  ctx.clearRect(0,0,600,400);

  let h={x:s[0].x+dx,y:s[0].y+dy};

  if(h.x<0||h.y<0||h.x>=600||h.y>=400) return over();

  s.unshift(h);

  if(h.x===f.x&&h.y===f.y){
    score++;
    f=food();
  }else s.pop();

  s.forEach((p,i)=>drawSnakePart(p.x,p.y,i===0));
  apple(f.x,f.y);

  update();
}

/* ---------- RUNNER ---------- */
let p,o,g;

function runner(){
  p={x:50,y:300,vy:0};
  o=[];g=1;score=0;

  document.onkeydown=e=>{
    if((e.code==="Space"||e.key==="ArrowUp")&&p.y===300)p.vy=-15;
  };

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,600,400);

  p.vy+=g;
  p.y+=p.vy;
  if(p.y>300)p.y=300;

  if(Math.random()<0.02)o.push({x:600,y:320});

  o.forEach(x=>x.x-=6);
  o=o.filter(x=>x.x>-20);

  for(let x of o) if(x.x<80&&p.y===300) return over();

  ctx.fillStyle="#00ffff";
  ctx.fillRect(p.x,p.y,30,30);

  ctx.fillStyle="#ff0044";
  o.forEach(x=>ctx.fillRect(x.x,x.y,20,20));

  score++;
  update();
}

/* ---------- PONG ---------- */
let pad,ball,hold=false;

function pong(){
  pad={x:260,y:370,w:80,h:10};
  ball={x:300,y:200,dx:5,dy:-5};
  score=0;

  c.onmousedown=()=>hold=true;
  c.onmouseup=()=>hold=false;

  c.onmousemove=e=>{
    if(!hold)return;
    let r=c.getBoundingClientRect();
    pad.x=e.clientX-r.left-pad.w/2;
    pad.x=Math.max(0,Math.min(600-pad.w,pad.x));
  };

  loop=setInterval(drawPong,25);
}

function drawPong(){
  ctx.clearRect(0,0,600,400);

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>600)ball.dx*=-1;
  if(ball.y<0)ball.dy*=-1;

  if(ball.y>pad.y&&ball.x>pad.x&&ball.x<pad.x+pad.w){
    ball.dy*=-1;
    ball.dx*=1.1;
    score++;
  }

  if(ball.y>400) return over();

  ctx.fillStyle="#fff";
  ctx.fillRect(pad.x,pad.y,pad.w,pad.h);

  ctx.beginPath();
  ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
  ctx.fill();

  update();
}

/* ---------- COMMON ---------- */
function update(){
  document.getElementById("score").innerText=
    `${name} | ${game.toUpperCase()} : ${score}`;
}

function over(){
  clearInterval(loop);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
