<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Arcade Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
  color:white;
  background: linear-gradient(270deg,#1b0033,#5a00a8,#0a001a);
  background-size:600% 600%;
  animation: bg 12s infinite;
  overflow:hidden;
}
@keyframes bg{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

h1{margin-top:30px}
.neon{
  font-size:60px;
  color:#ff4fd8;
  text-shadow:0 0 15px #ff00cc,0 0 30px #ff00cc;
}

button{
  padding:15px 25px;
  margin:10px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  font-size:16px;
}

.menu button{background:white;color:black;}
.start{background:#ff00aa;color:white;}

input{
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:20px;
  background:rgba(0,0,0,0.5);
  color:white;
}

canvas{
  display:none;
  background:black;
  margin:20px auto;
  border-radius:15px;
}

#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}

#score{
  position:absolute;
  top:10px;
  left:10px;
}

#controls{display:none;}
#controls button{width:60px;height:60px;}
</style>

</head>

<body>

<div id="menu" class="menu">
  <h1>Mini Arcade</h1>
  <div class="neon">EGames</div>

<button onclick="selectGame('snake')">Snake</button> <button onclick="selectGame('runner')">Runner</button><br>

<input id="name" placeholder="Enter name"><br> <button class="start" onclick="startGame()">Start Game</button>

</div>

<div id="score"></div>

<div id="overlay">
  <h2>Game Over</h2>
  <button onclick="startGame()">Restart</button>
  <button onclick="home()">Home</button>
</div>

<canvas id="canvas" width="600" height="400"></canvas>

<div id="controls">
  <button onclick="dir('up')">↑</button><br>
  <button onclick="dir('left')">←</button>
  <button onclick="dir('down')">↓</button>
  <button onclick="dir('right')">→</button>
</div>

<script>
const c=document.getElementById("canvas");
const ctx=c.getContext("2d");

let game=null,loop,name="";
let score=0,high=localStorage.getItem("high")||0;

/* ---------- MENU ---------- */
function selectGame(g){
  game=g;
}

function startGame(){
  name=document.getElementById("name").value || "Player";
  if(!game){alert("Select game");return;}

  document.getElementById("menu").style.display="none";
  document.getElementById("overlay").style.display="none";
  c.style.display="block";

  clearInterval(loop);

  if(game==="snake") snakeStart();
  if(game==="runner") runnerStart();
}

function home(){
  clearInterval(loop);
  c.style.display="none";
  document.getElementById("menu").style.display="block";
  document.getElementById("overlay").style.display="none";
  document.getElementById("controls").style.display="none";
}

/* ---------- SNAKE ---------- */
let snake,food,dx,dy;

function snakeStart(){
  snake=[{x:200,y:200}];
  dx=20; dy=0;
  food=randomFood();
  score=0;

  document.getElementById("controls").style.display="block";

  document.onkeydown=e=>{
    if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-20;}
    if(e.key==="ArrowDown"&&dy===0){dx=0;dy=20;}
    if(e.key==="ArrowLeft"&&dx===0){dx=-20;dy=0;}
    if(e.key==="ArrowRight"&&dx===0){dx=20;dy=0;}
  };

  loop=setInterval(drawSnake,100);
}

function randomFood(){
  return {
    x:Math.floor(Math.random()*30)*20,
    y:Math.floor(Math.random()*20)*20
  };
}

function drawSnake(){
  ctx.clearRect(0,0,c.width,c.height);

  let head={x:snake[0].x+dx,y:snake[0].y+dy};

  if(head.x<0||head.y<0||head.x>=c.width||head.y>=c.height){
    return gameOver();
  }

  for(let s of snake){
    if(head.x===s.x&&head.y===s.y){
      return gameOver();
    }
  }

  snake.unshift(head);

  if(head.x===food.x&&head.y===food.y){
    score++;
    food=randomFood();
  }else snake.pop();

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,20,20);

  ctx.fillStyle="lime";
  snake.forEach(s=>ctx.fillRect(s.x,s.y,20,20));

  updateScore();
}

function dir(d){
  if(d==="up"&&dy===0){dx=0;dy=-20;}
  if(d==="down"&&dy===0){dx=0;dy=20;}
  if(d==="left"&&dx===0){dx=-20;dy=0;}
  if(d==="right"&&dx===0){dx=20;dy=0;}
}

/* ---------- RUNNER ---------- */
let player,obs,gravity;

function runnerStart(){
  player={x:50,y:300,w:30,h:30,vy:0};
  obs=[];
  gravity=1;
  score=0;

  document.getElementById("controls").style.display="none";

  document.onkeydown=e=>{
    if(e.code==="Space"&&player.y===300)player.vy=-15;
  };

  c.onclick=()=>{if(player.y===300)player.vy=-15;}

  loop=setInterval(drawRunner,30);
}

function drawRunner(){
  ctx.clearRect(0,0,c.width,c.height);

  player.vy+=gravity;
  player.y+=player.vy;
  if(player.y>300)player.y=300;

  if(Math.random()<0.02){
    obs.push({x:600,y:320,w:20,h:20});
  }

  obs.forEach(o=>o.x-=5);

  for(let o of obs){
    if(player.x<o.x+o.w && player.x+player.w>o.x &&
       player.y<o.y+o.h && player.y+player.h>o.y){
      return gameOver();
    }
  }

  ctx.fillStyle="white";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle="red";
  obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

  score++;
  updateScore();
}

/* ---------- COMMON ---------- */
function updateScore(){
  if(score>high){
    high=score;
    localStorage.setItem("high",high);
  }
  document.getElementById("score").innerHTML =
    `${name} | Score: ${score} | High: ${high}`;
}

function gameOver(){
  clearInterval(loop);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
