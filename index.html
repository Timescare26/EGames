<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade X Boot</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  color:white;
}

/* ---------- BOOT SCREEN ---------- */
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#000;
  z-index:999;
}

.grid-bg{
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(255,0,0,0.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,0,0,0.15) 1px, transparent 1px);
  background-size:40px 40px;
  animation:gridMove 6s linear infinite;
  transform:perspective(600px) rotateX(60deg);
}

@keyframes gridMove{
  from{background-position:0 0}
  to{background-position:0 40px}
}

#title{
  font-size:80px;
  font-weight:bold;
  background:linear-gradient(90deg,#ffcc00,#ff3300,#00aaff);
  -webkit-background-clip:text;
  color:transparent;
  animation:glow 1.5s infinite alternate;
  z-index:2;
}

@keyframes glow{
  from{filter:drop-shadow(0 0 10px #ff0000);}
  to{filter:drop-shadow(0 0 30px #ff6600);}
}

#startBtn{
  margin-top:20px;
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:white;
  cursor:pointer;
  z-index:2;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0.3}
}

/* ---------- MAIN MENU ---------- */
#menu{
  display:none;
  text-align:center;
  padding-top:60px;
  background: linear-gradient(270deg,#1b0033,#5a00a8,#0a001a);
  background-size:600% 600%;
  animation:bg 10s infinite;
  height:100vh;
}

@keyframes bg{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

.neon{
  font-size:60px;
  text-shadow:0 0 20px #ff00cc;
}

button{
  padding:14px 22px;
  margin:8px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}
button:active{transform:scale(0.9)}
.selected{background:#ff00aa;color:white}

input{
  padding:10px;
  border-radius:10px;
  border:none;
}

/* ---------- ARCADE ---------- */
#arcade{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
}

.machine{
  background:#111;
  padding:18px;
  border-radius:18px;
  border:8px solid #444;
  box-shadow:0 0 35px #ff00cc;
}

canvas{
  width:90vw;
  max-width:600px;
  background:black;
  border-radius:10px;
}

#score{
  position:absolute;
  top:10px;
  left:10px;
}

#overlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
}
</style>

</head>

<body>

<!-- BOOT SCREEN -->

<div id="boot">
  <div class="grid-bg"></div>
  <div id="title">ARCADE</div>
  <button id="startBtn" onclick="enter()">Press Start</button>
</div>

<!-- MENU -->

<div id="menu">
  <h1>Mini Arcade</h1>
  <div class="neon">EGames</div>

<button onclick="selectGame('snake',this)">🐍 Snake</button> <button onclick="selectGame('runner',this)">🏃 Runner</button> <button onclick="selectGame('pong',this)">🏓 Pong</button><br>

<input id="name" placeholder="Enter name"><br> <button onclick="startGame()">Start</button>

</div>

<div id="score"></div>

<div id="overlay">
  <h2>Game Over</h2>
  <button onclick="startGame()">Restart</button>
  <button onclick="home()">Home</button>
</div>

<div id="arcade">
  <div class="machine">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
</div>

<script>
/* ---------- UI FLOW ---------- */
function enter(){
  document.getElementById("boot").style.opacity="0";
  setTimeout(()=>{
    document.getElementById("boot").style.display="none";
    document.getElementById("menu").style.display="block";
  },800);
}

/* ---------- BASIC SETUP ---------- */
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let game=null,loop,name="";
let score=0;

/* HIGH SCORE */
let high={snake:0,runner:0,pong:0};

/* SOUND */
function beep(f){
  let a=new AudioContext();
  let o=a.createOscillator();
  o.frequency.value=f;
  o.connect(a.destination);
  o.start();
  o.stop(a.currentTime+0.08);
}

/* MENU */
function selectGame(g,el){
  game=g;
  document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");
}

function startGame(){
  name=document.getElementById("name").value||"Player";
  if(!game)return alert("Select game");

  document.getElementById("menu").style.display="none";
  document.getElementById("arcade").style.display="flex";
  document.getElementById("overlay").style.display="none";

  clearInterval(loop);

  if(game==="snake") snakeStart();
  if(game==="runner") runnerStart();
  if(game==="pong") pongStart();
}

function home(){
  clearInterval(loop);
  document.getElementById("arcade").style.display="none";
  document.getElementById("menu").style.display="block";
}

/* GRID */
function grid(){
  ctx.strokeStyle="rgba(255,255,255,0.05)";
  for(let i=0;i<600;i+=20){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);ctx.stroke();
  }
}

/* ---------- GAME OVER ---------- */
function gameOver(){
  clearInterval(loop);
  beep(200);
  document.getElementById("overlay").style.display="block";
}
</script>

</body>
</html>
